name: CI Pipeline - TP-1-IyCSW

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  validate-codeowners:
    name: Validar CODEOWNERS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Comprobar existencia de CODEOWNERS
        run: |
          if [ -f ".github/CODEOWNERS" ] || [ -f "CODEOWNERS" ] || [ -f "docs/CODEOWNERS" ]; then
            echo "CODEOWNERS verificado correctamente."
          else
            echo "ERROR: No se encontro el archivo CODEOWNERS."
            exit 1
          fi

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
 
      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
 
      - name: Compilar y correr los tests
        run: mvn -B verify